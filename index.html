<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <title>Bancada QA</title>
    <style>
    body {
      background: #131211;
      color: #eeebe6;
      font-family: Arial, sans-serif;
      max-width: 800px;
      margin: 40px auto;
      padding: 0 16px;
    }
    h1 { font-size: 28px; margin-bottom: 4px; }
    p  { color: #a29d96; }

    form {
      background: #1d1b19;
      border: 1px solid #2f2c29;
      border-radius: 10px;
      padding: 20px;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }
    label {
      display: flex;
      flex-direction: column;
      gap: 6px;
      font-size: 13px;
      color: #a29d96;
    }
    input {
      background: #171614;
      color: #eeebe6;
      border: 1px solid #2f2c29;
      border-radius: 8px;
      padding: 10px;
      font-size: 15px;
    }
    button {
      background: #f08343;
      color: #1a1310;
      border: none;
      border-radius: 8px;
      padding: 10px;
      font-weight: bold;
      font-size: 15px;
      cursor: pointer;
      align-self: flex-start;
    }
          #lista { list-style: none; padding: 0; display: flex; flex-direction: column; gap: 10px; margin-top: 20px; }
    #lista li {
      background: #1d1b19;
      border: 1px solid #2f2c29;
      border-radius: 10px;
      padding: 12px 16px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .status { background: #1d2a3a; color: #86b0e0; border-radius: 999px; padding: 2px 10px; font-size: 12px; }
  </style>
</head>
<body>
  <h1>Fila do agente</h1>
  <p>Coloque as histórias na fila.</p>

  <form id="form-fila">
    <label>Chave <input id="chave" placeholder="DEMO-101" maxlength="20"></label>
    <label>Título <input id="titulo" placeholder="Login com e-mail" maxlength="120"></label>
    <button type="submit">Colocar na fila</button>
  </form>

  <ul id="lista"></ul>
     <script>
    const form = document.getElementById("form-fila");
    const lista = document.getElementById("lista");

    // 1. Carrega a fila salva no navegador (ou começa vazia)
    let fila = JSON.parse(localStorage.getItem("fila") || "[]");

    // 2. Desenha a lista na tela
    function mostrar() {
      lista.innerHTML = "";
      fila.forEach(function (h) {
        const item = document.createElement("li");
        const texto = document.createElement("span");
        texto.textContent = h.chave + "  " + h.titulo;   // textContent = seguro, nunca vira código
        const status = document.createElement("span");
        status.className = "status";
        status.textContent = "Na fila";
        item.append(texto, status);
        lista.append(item);
      });
    }

    // 3. Quando clicar em "Colocar na fila"
    form.addEventListener("submit", function (evento) {
      evento.preventDefault();
      const chave = document.getElementById("chave").value.trim().toUpperCase();
      const titulo = document.getElementById("titulo").value.trim();

      if (!/^[A-Z][A-Z0-9]+-\d+$/.test(chave)) {
        alert("A chave precisa ter o formato ABC-123.");
        return;
      }
      if (fila.some(function (h) { return h.chave === chave; })) {
        alert(chave + " já está na fila.");
        return;
      }

      fila.unshift({ chave: chave, titulo: titulo });
      localStorage.setItem("fila", JSON.stringify(fila));   // salva no navegador
      mostrar();
      form.reset();
    });

    mostrar();
  </script>
</body>
</html>
