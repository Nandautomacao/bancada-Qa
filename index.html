<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <title>Bancada QA</title>
    <style>
    body {
      background: #131211;
      color: #eeebe6;
      font-family: Arial, sans-serif;
      max-width: 800px;
      margin: 40px auto;
      padding: 0 16px;
    }
    h1 { font-size: 28px; margin-bottom: 4px; }
    p  { color: #a29d96; }

    form {
      background: #1d1b19;
      border: 1px solid #2f2c29;
      border-radius: 10px;
      padding: 20px;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }
    label {
      display: flex;
      flex-direction: column;
      gap: 6px;
      font-size: 13px;
      color: #a29d96;
    }
    input {
      background: #171614;
      color: #eeebe6;
      border: 1px solid #2f2c29;
      border-radius: 8px;
      padding: 10px;
      font-size: 15px;
    }
    button {
      background: #f08343;
      color: #1a1310;
      border: none;
      border-radius: 8px;
      padding: 10px;
      font-weight: bold;
      font-size: 15px;
      cursor: pointer;
      align-self: flex-start;
    }
  </style>
</head>
<body>
  <h1>Fila do agente</h1>
  <p>Coloque as histórias na fila.</p>

  <form id="form-fila">
    <label>Chave <input id="chave" placeholder="DEMO-101"></label>
    <label>Título <input id="titulo" placeholder="Login com e-mail"></label>
    <button type="submit">Colocar na fila</button>
  </form>

  <ul id="lista"></ul>
</body>
</html>
